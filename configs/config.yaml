server:
  port: 3000
  mode: release  # debug/release

database:
  host: localhost
  port: 5432
  user: comfy
  password: comfy123
  dbname: comfy_cloud
  sslmode: disable  # disable/require

jwt:
  secret: "your-jwt-secret-key-change-in-production"
  expiration: 24h

comfy_instances:
  # 共享池实例（用于排队模式）
  shared:
    - url: http://localhost:8188
    - url: http://localhost:8189
    - url: http://localhost:8190
    - url: http://localhost:8191
    - url: http://localhost:8192
    - url: http://localhost:8193
  # 独占池实例（预留给独占模式用户）
  # dedicated:
  #   - url: http://localhost:8194
  #   - url: http://localhost:8195

loadbalancer:
  health_check_interval: 10s  # 健康检查间隔
  queue_update_interval: 2s   # 队列状态更新间隔
  max_queue_size: 10          # 最大队列长度

logging:
  level: info  # debug/info/warn/error
  output: stdout  # stdout/file
  file: logs/proxy.log

storage:
  user_data_dir: ./data/users      # 用户数据根目录
  shared_models_dir: ./data/models # 共享模型目录
  max_user_storage_gb: 100         # 每个用户最大存储空间（GB）

redis:
  addr: localhost:6379
  password: ""
  db: 0

rate_limit:
  enabled: true
  requests_per_minute: 60
